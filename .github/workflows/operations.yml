name: Operations (render worker, cleanup, uptime)

# Free infrastructure: GitHub-hosted runners are free for public repositories.
# Requires repository secrets SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY (render + cleanup)
# and variable SITE_URL (uptime check). Jobs skip gracefully when they are missing.
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: operations
  cancel-in-progress: false

jobs:
  render-and-cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Check configuration and queue
        id: queue
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then echo "Secrets not configured; skipping."; echo "run=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          count=$(curl -s -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" -H "Prefer: count=exact" -H "Range: 0-0" \
            "$SUPABASE_URL/rest/v1/render_jobs?select=id&status=eq.queued" -o /dev/null -D - | grep -i content-range | sed 's/.*\///' | tr -d '\r')
          echo "Queued jobs: ${count:-unknown}"
          minute=$(date -u +%M); hour=$(date -u +%H)
          # Always run when jobs are queued; otherwise run once a day (03:00 UTC) for demo cleanup.
          if [ "${count:-0}" != "0" ] || { [ "$hour" = "03" ] && [ "$minute" -lt 15 ]; } || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; else echo "run=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v4
        if: steps.queue.outputs.run == 'true'
      - uses: actions/setup-node@v4
        if: steps.queue.outputs.run == 'true'
        with: { node-version-file: .nvmrc, cache: npm }
      - if: steps.queue.outputs.run == 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - if: steps.queue.outputs.run == 'true'
        run: npm ci --no-audit --no-fund
      - name: Render queued jobs, then demo cleanup
        if: steps.queue.outputs.run == 'true'
        run: npx tsx --tsconfig tsconfig.worker.json worker/render-worker.ts --once
        env:
          WORKER_MAX_MINUTES: '35'

  uptime:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check public pages
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          if [ -z "$SITE_URL" ]; then echo "SITE_URL variable not set; skipping."; exit 0; fi
          fail=0
          for p in / /products /contact /api/demo/heartbeat; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X GET "$SITE_URL$p")
            echo "$p -> $code"
            case "$p:$code" in "/api/demo/heartbeat:405"|"/api/demo/heartbeat:401") ;; *:200) ;; *) fail=1 ;; esac
          done
          exit $fail
